name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: eve_relation_rag
          POSTGRES_USER: eve
          POSTGRES_PASSWORD: eve_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eve -d eve_relation_rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      EVE_RAG_ENVIRONMENT: test
      EVE_RAG_DATABASE_URL: postgresql+psycopg://eve:eve_ci_password@localhost:5432/eve_relation_rag

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev --extra demo

      - name: Verify lock and documentation
        run: |
          uv lock --check
          uv run python scripts/check_docs.py

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check migration-model parity
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src app

      - name: Build distribution artifacts
        run: |
          uv build
          uv run python scripts/check_distribution.py

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and smoke-test isolated local demo
        env:
          M5_SMOKE_PROJECT: eve-rag-m5-smoke-ci-${{ github.run_id }}-${{ github.run_attempt }}
          M5_SMOKE_POSTGRES_PORT: "55432"
          M5_SMOKE_API_PORT: "58000"
          M5_SMOKE_DEMO_PORT: "58501"
        run: sh scripts/container_smoke.sh
