name: V0 publication

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full 40-character main commit approved for V0 publication
        required: true
        type: string
      confirmation:
        description: Enter publish-v0.1.0:<release_commit>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v0.1.0-publication
  cancel-in-progress: false

env:
  RELEASE_VERSION: "0.1.0"
  RELEASE_TAG: v0.1.0
  IMAGE_NAME: ghcr.io/hongda-zhao/endoviho-rag
  IMAGE_TAG: ghcr.io/hongda-zhao/endoviho-rag:v0.1.0

jobs:
  preflight:
    name: Exact-commit V0 preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: eve_relation_rag
          POSTGRES_USER: eve
          POSTGRES_PASSWORD: eve_v0_preflight_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eve -d eve_relation_rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EVE_RAG_ENVIRONMENT: test
      EVE_RAG_DATABASE_URL: >-
        postgresql+psycopg://eve:eve_v0_preflight_password@localhost:5432/eve_relation_rag

    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify manual intent and exact main identity
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "${RELEASE_COMMIT}" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#RELEASE_COMMIT}" -eq 40
          test "${RELEASE_CONFIRMATION}" = "publish-v0.1.0:${RELEASE_COMMIT}"
          test "${WORKFLOW_REF}" = "refs/heads/main"
          test "${WORKFLOW_COMMIT}" = "${RELEASE_COMMIT}"
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "${RELEASE_COMMIT}"
          existing_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          test -z "${existing_tag}"

      - name: Verify ACT-D10 repository governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_v0_governance.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true

      - name: Install exact locked dependencies
        run: uv sync --locked --dev --extra demo

      - name: Verify typed repository activation and restricted-byte gates
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: >-
          uv run python scripts/v0_release_preflight.py repository
          --expected-commit "${RELEASE_COMMIT}"

      - name: Recheck lock, canonical records, and Compose model
        run: |
          set -euo pipefail
          uv lock --check
          uv run python scripts/check_m5_artifacts.py --check --profile activation
          uv run python scripts/check_docs.py
          docker compose config --quiet

      - name: Replay all migrations on the fresh database
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic check

      - name: Run complete and frozen benchmark tests
        run: |
          set -euo pipefail
          uv run pytest
          uv run pytest tests/benchmark tests/literature/test_benchmarking.py

      - name: Run static quality gates
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run mypy src app

      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          mkdir release-assets
          uv build --out-dir release-assets
          uv run python scripts/check_distribution.py --dist release-assets

      - name: Build exact source archive
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: >-
          git archive --format=tar.gz
          --prefix="EndoViHo-RAG-${RELEASE_VERSION}/"
          --output="release-assets/eve-relation-rag-${RELEASE_TAG}-source.tar.gz"
          "${RELEASE_COMMIT}"

      - name: Generate pinned SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/eve-relation-rag-v0.1.0.spdx.json
          syft-version: v1.42.3
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Bind checksums and release notes to the exact commit
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: >-
          python3 scripts/v0_release_preflight.py prepare-assets
          --assets-dir release-assets
          --expected-commit "${RELEASE_COMMIT}"

      - name: Verify a fresh wheel install
        run: >-
          uv run --isolated --no-project
          --with ./release-assets/eve_relation_rag-0.1.0-py3-none-any.whl
          eve-relation-rag --help

      - name: Run exact-commit fresh-volume smoke
        env:
          M5_SMOKE_PROJECT: eve-rag-m5-smoke-v0-${{ github.run_id }}-${{ github.run_attempt }}
          M5_SMOKE_POSTGRES_PORT: "55432"
          M5_SMOKE_API_PORT: "58000"
          M5_SMOKE_DEMO_PORT: "58501"
        run: sh scripts/container_smoke.sh

      - name: Stage immutable preflight outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v0.1.0-${{ inputs.release_commit }}
          path: release-assets/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0

  publish:
    name: Protected V0 publication
    needs: preflight
    runs-on: ubuntu-latest
    environment: v0-production
    permissions:
      actions: read
      attestations: write
      contents: write
      deployments: read
      id-token: write
      packages: write

    steps:
      - name: Check out the approved commit with tag credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"

      - name: Install exact locked runtime dependencies
        run: uv sync --locked

      - name: Revalidate main, governance, and repository state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "${RELEASE_CONFIRMATION}" = "publish-v0.1.0:${RELEASE_COMMIT}"
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "${RELEASE_COMMIT}"
          existing_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          test -z "${existing_tag}"
          python3 scripts/check_v0_governance.py
          uv run python scripts/v0_release_preflight.py repository --expected-commit "${RELEASE_COMMIT}"
          uv run python scripts/check_m5_artifacts.py --check --profile activation

      - name: Download the exact preflight outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: v0.1.0-${{ inputs.release_commit }}
          path: release-assets

      - name: Revalidate exact preflight outputs
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: >-
          python3 scripts/v0_release_preflight.py assets --assets-dir release-assets --expected-commit "${RELEASE_COMMIT}"

      - name: Create and push protected annotated tag
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${RELEASE_TAG}" "${RELEASE_COMMIT}" --message "EndoViHo-RAG V0 ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Attest source, wheel, sdist, and SBOM provenance
        id: artifact-provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Stage artifact provenance bundle
        env:
          PROVENANCE_BUNDLE: ${{ steps.artifact-provenance.outputs.bundle-path }}
        run: >-
          cp -- "${PROVENANCE_BUNDLE}"
          release-assets/eve-relation-rag-v0.1.0-provenance.sigstore.json

      - name: Publish GitHub Release and artifact set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            release-assets/eve-relation-rag-v0.1.0-source.tar.gz \
            release-assets/eve_relation_rag-0.1.0-py3-none-any.whl \
            release-assets/eve_relation_rag-0.1.0.tar.gz \
            release-assets/SHA256SUMS \
            release-assets/eve-relation-rag-v0.1.0.spdx.json \
            release-assets/eve-relation-rag-v0.1.0-provenance.sigstore.json \
            --verify-tag \
            --title "EndoViHo-RAG V0 (v0.1.0)" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --latest

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Publish the multi-platform GHCR image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/hongda-zhao/endoviho-rag:v0.1.0
          provenance: false
          labels: |
            org.opencontainers.image.title=EndoViHo-RAG
            org.opencontainers.image.version=0.1.0
            org.opencontainers.image.revision=${{ inputs.release_commit }}
            org.opencontainers.image.source=https://github.com/Hongda-Zhao/EndoViHo-RAG

      - name: Validate and attest the immutable image digest
        id: image-provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/hongda-zhao/endoviho-rag
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Record GHCR digest and image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_PROVENANCE_BUNDLE: ${{ steps.image-provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          digest_hex="${IMAGE_DIGEST#sha256:}"
          case "${digest_hex}" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#digest_hex}" -eq 64
          printf '%s@%s\n' "${IMAGE_NAME}" "${IMAGE_DIGEST}" > ghcr-image-digest.txt
          cp -- "${IMAGE_PROVENANCE_BUNDLE}" ghcr-image-provenance.sigstore.json
          gh release upload "${RELEASE_TAG}" \
            ghcr-image-digest.txt \
            ghcr-image-provenance.sigstore.json

      - name: Verify published artifacts, tag, install, and image pull
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "${RELEASE_COMMIT}"
          mkdir verified-release-assets
          gh release download "${RELEASE_TAG}" --dir verified-release-assets
          cd verified-release-assets
          sha256sum --check SHA256SUMS
          cd ..
          while read -r _ artifact; do
            gh attestation verify "verified-release-assets/${artifact}" --repo "${GITHUB_REPOSITORY}"
          done < verified-release-assets/SHA256SUMS
          uv run --isolated --no-project \
            --with ./verified-release-assets/eve_relation_rag-0.1.0-py3-none-any.whl \
            eve-relation-rag --help
          docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "${IMAGE_NAME}@${IMAGE_DIGEST}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE_NAME}@${IMAGE_DIGEST}")" = "${RELEASE_VERSION}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_NAME}@${IMAGE_DIGEST}")" = "${RELEASE_COMMIT}"
          docker run --rm "${IMAGE_NAME}@${IMAGE_DIGEST}" python -c \
            "import eve_relation_rag; assert eve_relation_rag.__version__ == 'V0'"
